bug_to_user_story_v2:
  description: "Prompt V28.0 - Correctness Surgeon (Unbanning Circuit Breaker, Specific Cache)"
  techniques:
    - "Role Prompting: Solutions Architect"
    - "Few-shot Learning: 3 REAL examples"
    - "Structure: Table + Adaptive Sectioning"
    - "Refinement: Unbanned Circuit Breaker, Forced Batch Size 50"
    - "Format: PT-BR Gherkin"
  tags:
    - "bug-analysis"
